<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Séparation</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  .sep{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .trait{flex:1;height:3px;border-radius:3px}
  .gauche{background:linear-gradient(to right,rgba(52,10,18,0),#340a12 55%,#340a12)}
  .droite{background:linear-gradient(to left,rgba(52,10,18,0),#340a12 55%,#340a12)}
  .point{width:5px;height:5px;border-radius:50%;background:#340a12;flex:none}
  svg{width:26px;height:26px;flex:none}
</style>
</head>
<body>
  <div class="sep" role="separator" aria-hidden="true">
    <span class="trait gauche"></span>
    <span class="point"></span>
    <svg viewBox="0 0 24 24"><path d="M12 0 C13 8 14 10 24 12 C14 14 13 16 12 24 C11 16 10 14 0 12 C10 10 11 8 12 0 Z" fill="#340a12"/></svg>
    <span class="point"></span>
    <span class="trait droite"></span>
  </div>
</body>
</html>
